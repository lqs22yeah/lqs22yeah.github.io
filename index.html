<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiushi Lin</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
        }

        .profile-pic {
            width: 96%;
            height: 95%;
            border-radius: 10%;
            margin-bottom: 0px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        .profile-pic-outer {
            width: 200px;
            height: 200px;
            margin-bottom: 0px;
            text-align: center;
            margin-left: auto;
            margin-right: auto;
        }

        .profile-pic-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
        }

        .profile-pic-front, .profile-pic-back {
            position: absolute;
            width: 102%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .profile-pic-back {
            transform: rotateY(180deg);
        }

        h1 {
            width: fit-content;
            margin: auto;
            font-size: 36px;
            margin-bottom: 10px;
            color: #333;
            transition: transform 0.3s ease;
        }

        p.subtitle {
            width: fit-content;
            margin: auto;
            font-family: 'Mulish', sans-serif;
            font-size: 18px;
            margin-bottom: 20px;
            color: #777;
            transition: transform 0.3s ease;
        }

        .content {
            width: 100%;
            height: fit-content;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 24px;
            margin-left: 20px;
            margin-right: 20px;
            margin-bottom: 15px;
            text-indent: 10px;
            color: #333;
            position: relative;
            padding-bottom: 5px;
        }

        .section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #3f7cff;
        }

        .section p {
            font-family: 'Mulish', sans-serif;
            line-height: 1.6;
            font-size: 15px;
            color: #555;
            text-align: justify;
            margin-left: 20px;
            margin-right: 20px;
        }

        .section p a {
            color: #555;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .section p a:hover {
            color: #7dbf6b;
        }

        .section p span {
            float: right;
            color: #777;
        }

        .header-icons {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .header-icons a {
            display: block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
            background-color: #3f7cff;
            color: #fff;
            margin-left: 10px;
            margin-bottom: 10px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        .header-icons a:hover {
            background-color: #3366cc;
        }

        .header-switch {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }

        .header-switch a {
            display: block;
            padding: 5px 10px;
            font-size: 20px;
            text-align: center;
            background-color: #fff;
            color: #3f7cff;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, color 0.3s ease;
            cursor: pointer;
        }

        .header-switch-divider {
            width: 2px;
            height: 20px;
            background-color: #3f7cff;
            margin: 0 10px;
        }

        .footnote {
            max-width: 800px;
            margin: 20px auto;
            font-family: 'Merriweather', serif;
            font-size: 12px;
            color: #555;
            text-align: right;
        }

        .album {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .album-item {
            width: fit-content;
            height: fit-content;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            display: inline-block;
            vertical-align: top;
            margin: 10px;
        }

        .album-photos {
            display: grid;
            grid-template-columns: repeat(var(--photo-count), minmax(0, 220px));
            gap: 20px;
            justify-content: center;
            margin: 0 auto;
        }

        .album-photo-frame {
            min-width: 0;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 40%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .album-photo {
            display: block;
            width: 100%;
            height: 100%;
        }

        .album-photos--four {
            gap: 16px;
        }

        .album-photos--four .album-photo-frame {
            aspect-ratio: 4 / 3;
            border-radius: 24px;
        }

        .album-photos--four .album-photo {
            object-fit: cover;
            object-position: center 35%;
        }

        .album-photos--four .album-photo--graduation {
            transform: scale(1.55);
            transform-origin: 62% 100%;
        }

        @media (max-width: 600px) {
            .album-photos--four {
                grid-template-columns: repeat(2, minmax(0, 220px));
                gap: 12px;
            }
        }

        .album-about {
            width: 300px;
            height: fit-content;
            font-family: 'Mulish', sans-serif;
            font-size: 15px;
            color: #555;
            text-align: center;
        }

        .album-about a {
            color: #555;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .album-about a:hover {
            color: #3f7cff;
            font-weight: bold;
        }
        .pub-item {
            display: flex;
            flex-direction: row;
            align-items: center;            /* 使文字和图片垂直对齐 */
            gap: 16px;
            margin: 20px;
        }

        .pub-thumb {
            width: 100px;         /* 稍微大一点会清晰很多 */
            height: 100px;
            object-fit: cover;    /* 按比例放大直到填满 */
            object-position: top center;  /* 🔥 裁剪从图片上方中心区域 */
            border-radius: 10px;
            flex-shrink: 0;
            box-shadow: 0 0 5px rgba(0,0,0,0.15);
        }

        .pub-text {
            flex: 1;                         /* 让文字占满右侧 */
            font-family: 'Mulish', sans-serif;
            line-height: 1.55;
            font-size: 15px;
            color: #555;
            text-align: left;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Mulish:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="profile-pic-outer">
                <div class="profile-pic-inner" id="profile-pic">
                    <div class="profile-pic-front">
                        <img class="profile-pic" src="info/photo.png">
                    </div>
                    <div class="profile-pic-back">
                        <img class="profile-pic" src="info/photo2.jpeg">
                    </div>
                </div>
            </div>
            <h1>Qiushi Lin</h1>
            <div class="header-switch">
                <a id="switch-research">Research</a>
                <div class="header-switch-divider"></div>
                <a id="switch-life">Life</a>
            </div>
            <div class="header-icons">
                <a href="cv/qiushi_cv_self.pdf"><strong>CV</strong></a>
                <a href="https://scholar.google.com/citations?user=VgZcoRoAAAAJ&hl=zh-CN"><i class="fa-brands fa-google-scholar"></i></a>
                <a href="https://github.com/lqs22yeah"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/qiushi-lin-50782a356/" aria-label="LinkedIn" title="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
            </div>
        </header>
        <div class="content" id="content"></div>
    </div>

    <script>
        
        const front_page_json = 'info/me.json';
        const back_page_json = 'info/me2.json';
        let toggled = true;
        document.getElementById('switch-research').addEventListener('click', function(event) {
            if (!toggled) {
                toggled = true;
                toggleSwitch(toggled);
            }
        });
        document.getElementById('switch-life').addEventListener('click', function(event) {
            if (toggled) {
                toggled = false;
                toggleSwitch(toggled);
            }
        });
        document.getElementById('profile-pic').addEventListener('click', function(event){
            toggled = !toggled;
            toggleSwitch(toggled);
        });
        toggleSwitch(toggled);

        function toggleSwitch(is_research) {
            const inner = document.querySelector('.profile-pic-inner');
            if (is_research) {
                inner.style.transform = '';
                updatePageContent(front_page_json);
            } else {
                inner.style.transform = 'rotateY(180deg)';
                updatePageContent(back_page_json);
            }
            const WHITE = '#fff';
            const BLUE = '#3f7cff';
            const sw_research = document.getElementById('switch-research');
            const sw_life = document.getElementById('switch-life');
            if (is_research) {
                sw_research.style.color = WHITE;
                sw_research.style.backgroundColor = BLUE;
                sw_life.style.color = BLUE;
                sw_life.style.backgroundColor = WHITE;
            }
            else {
                sw_research.style.color = BLUE;
                sw_research.style.backgroundColor = WHITE;
                sw_life.style.color = WHITE;
                sw_life.style.backgroundColor = BLUE;
            }
        }
        
        function updatePageContent(json_file) {
            document.getElementById('content').innerHTML = '';
            fetch(json_file)
                .then(response => response.json())
                .then(data => {
                    generateSections(data.sections);
                })
                .catch(error => console.error('Error fetching json:', error));
        }
        
        function generateSections(sections) {
            sections.forEach(section => {
                if (!section.show_in_html) {
                    return;
                }

                const sectionElement = document.createElement('section');
                sectionElement.classList.add('section');

                const titleElement = document.createElement('h2');
                titleElement.textContent = section.title;
                sectionElement.appendChild(titleElement);

                const format = section.format;
                switch (format) {
                    case 'paragraph':
                        generateParagraphSection(sectionElement, section.items);
                        break;
                    case 'organization':
                        generateOrganizationSection(sectionElement, section.items);
                        break;
                    case 'publication':
                        generatePublicationSection(sectionElement, section.items);
                        break;
                    case 'simple':
                        generateSimpleSection(sectionElement, section.items);
                        break;
                    case 'album':
                        generateAlbumSection(sectionElement, section.items);
                    default:
                        console.error('Error parsing json format');
                }

                document.getElementById('content').appendChild(sectionElement);
            });
        }

        function generateParagraphSection(sectionElement, items) {
            items.forEach(item => {
                const itemElement = document.createElement('p');
                itemElement.innerHTML = item;
                sectionElement.appendChild(itemElement);
            })
        }

        function generateOrganizationSection(sectionElement, items) {
            items.forEach(item => {
                const itemElement = document.createElement('p');
                itemElement.innerHTML = `<a href=${item.organization_link}><strong>${item.organization}</strong></a>`
                if (item.organization2) {
                    itemElement.innerHTML += ` & <a href=${item.organization2_link}><strong>${item.organization2}</strong></a>`
                }
                itemElement.innerHTML += ` <span><i>${item.years}</i></span>`;
                if (item.job_title) {
                    itemElement.innerHTML += `<br>${item.job_title}`;
                }
                if (item.details) {
                    itemElement.innerHTML += `<br>${item.details[0]}`;
                }
                sectionElement.appendChild(itemElement);
            })
        }

        function generatePublicationSection(sectionElement, items) {
            items.forEach(item => {
                 const wrapper = document.createElement('div');
                wrapper.classList.add('pub-item');   // 新增 class 用于排版

                // 左侧小图片
                if (item.image) {
                    const img = document.createElement('img');
                    img.classList.add('pub-thumb');
                    img.src = item.image;
                    img.alt = item.pub_title || 'publication image';
                    wrapper.appendChild(img);
                }

                // 右侧文字区
                const textElement = document.createElement('p');
                textElement.classList.add('pub-text');

                textElement.innerHTML =
                    `${item.authors}<br>` +
                    `<a href="${item.pub_link}"><strong>${item.pub_title}</strong></a><br>` +
                    `<i>${item.journal}</i>, ${item.year}`;

                if (item.etc) {
                    textElement.innerHTML += ` (${item.etc})`;
                }
                if (item.slides) {
                    textElement.innerHTML += ` <a href="${item.slides}">[Slides]</a>`;
                }
                if (item.poster) {
                    textElement.innerHTML += ` <a href="${item.poster}">[Poster]</a>`;
                }
                if (item.blog) {
                    textElement.innerHTML += ` <a href="${item.blog}">[Blog]</a>`;
                }

                wrapper.appendChild(textElement);
                sectionElement.appendChild(wrapper);
            })
        }

        function generateSimpleSection(sectionElement, items) {
            items.forEach(item => {
                const itemElement = document.createElement('p');
                if (item.years) {
                    itemElement.innerHTML = `${item.title} <span><i>${item.years}</i></span>`
                }
                else {
                    itemElement.innerHTML = `${item.title}`;
                }
                sectionElement.appendChild(itemElement);
            })
        }

        function generateAlbumSection(sectionElement, items) {
            // 1. 按 category 分组
            const groups = {};
            items.forEach(item => {
                // Preserve hidden photos in the data without rendering them.
                if (item.show_in_html === false) return;
                const cat = item.category || "Others";
                if (!groups[cat]) {
                    groups[cat] = [];
                }
                groups[cat].push(item);
            });

            // 2. 固定类别顺序（可根据你喜欢的顺序改）
            const order = ["Friends", "Sports", "Travel", "Whose cat? So cute!"];
            const categories = Object.keys(groups).sort((a, b) => {
                const ia = order.indexOf(a);
                const ib = order.indexOf(b);
                if (ia === -1 && ib === -1) return a.localeCompare(b);
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });

            // 3. 逐个类别渲染
            categories.forEach(cat => {
                const photos = groups[cat];

                // Render the category heading.
                const catTitle = document.createElement('h3');
                catTitle.textContent = cat;
                catTitle.style.margin = "10px 20px 5px";
                catTitle.style.fontSize = "18px";
                catTitle.style.color = "#333";
                sectionElement.appendChild(catTitle);

                // 这一组的相册容器
                const albumElement = document.createElement('div');
                albumElement.classList.add('album');

                // 3.1 在同一类别中按 group 再分组
                const groupMap = {};
                photos.forEach(item => {
                    const key = item.group || item.photo; // 没有 group 的就自己一组
                    if (!groupMap[key]) {
                        groupMap[key] = {
                            items: [],
                            about1: item.about1,
                            about2: item.about2,
                            location: item.location
                        };
                    }
                    groupMap[key].items.push(item);
                });

                // 3.2 渲染每一个 group（可能是一张图，也可能是多张图）
                Object.values(groupMap).forEach(group => {
                    const itemElement = document.createElement('div');
                    itemElement.classList.add('album-item');

                    // 🔹 让整个 group 居中
                    itemElement.style.width = "100%";
                    itemElement.style.textAlign = "center";

                    // 图片区域：如果一组多张，就横着排
                    const photosWrapper = document.createElement('div');
                    photosWrapper.classList.add('album-photos');
                    photosWrapper.style.setProperty('--photo-count', group.items.length);
                    if (group.items.length === 4) {
                        photosWrapper.classList.add('album-photos--four');
                    }

                    group.items.forEach(item => {
                        const frame = document.createElement('div');
                        frame.classList.add('album-photo-frame');
                        const photo = document.createElement('img');
                        photo.classList.add('album-photo');
                        if (item.photo_class) photo.classList.add(item.photo_class);
                        photo.src = item.photo;
                        photo.alt = item.alt || group.about1 || cat;
                        frame.appendChild(photo);
                        photosWrapper.appendChild(frame);
                    });

                    itemElement.appendChild(photosWrapper);

                    // 文字部分：about1 / about2 / location 用 group 的（共享 caption）
                    const about = document.createElement('div');
                    about.classList.add('album-about');

                    // 🔹 caption 居中
                    about.style.width = "100%";
                    about.style.textAlign = "center";
                    about.style.marginTop = "8px";

                    let aboutHtml = "";
                    if (group.about1) {
                        aboutHtml += `<strong>${group.about1}</strong><br>`;
                    }
                    if (group.about2) {
                        aboutHtml += `${group.about2}`;
                    }
                    if (group.location) {
                        aboutHtml += `<br><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps?q=${encodeURIComponent(group.location)}">📍 Map</a>`;
                    }

                    about.innerHTML = aboutHtml;
                    itemElement.appendChild(about);

                    albumElement.appendChild(itemElement);
                });

                sectionElement.appendChild(albumElement);
            });
        }

    </script>
</body>
</html>
